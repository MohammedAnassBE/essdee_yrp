          ["Planning", "Scope", [["Production detail", "34s GL Dyed Fabric-1"], ["Pattern", "Classic polo"], ["Order quantity", "2,080 Pcs"], ["Planned quantity", "2,016 Pcs"]]],
          ["Schedule", "Dates", [["Order date", "07-10-2026"], ["Planned start", "09-10-2026"], ["Planned end", "11-10-2026"], ["Priority", "High"]]],
          ["Status & Notes", "Control", [["Order status", "Submitted"], ["Planning", "Partially planned"], ["Material", "Reserved"], ["Comments", "Start with dark shades"]]]
        ],
        section: "Order quantity matrix", eyebrow: "Demand", count: "4 sizes",
        columns: ["Colour", "Panel", "S", "M", "L", "XL", "Total", "Planned"],
        rows: [
          ["Navy", "Garment", "350", "690", "690", "350", "2,080", "2,016"],
          ["Navy", "Collar", "350", "690", "690", "350", "2,080", "2,016"],
          ["Navy", "Cuff", "700", "1,380", "1,380", "700", "4,160", "4,032"]
        ],
        metrics: [["Order qty", "2,080"], ["Planned", "2,016"], ["Balance", "64"], ["Plans", "2"]],
        rail: [["Markers", [["YRP-MKR-2026-00031", "Open · 82.4%", ""], ["YRP-MKR-2026-00032", "Approved · 86.8%", ""]]], ["LaySheets", [["YRP-LS-2026-00118", "Active · 96 plys", ""], ["YRP-LS-2026-00119", "Draft · 84 plys", "warn"], ["YRP-LS-2026-00120", "Planned · 92 plys", "warn"]]]]
      },
      "bulk-lay-sheet": {
        area: "Cutting", back: "Bulk LaySheets", title: "Bulk LaySheets", id: "YRP-BLS-2026-00007", status: "Cutting",
        facts: [["Main lot", "F0926-49"], ["Location", "Cutting Floor · Tiruppur"], ["Active LaySheet", "YRP-LS-2026-00118"]],
        actions: ["Generate Bundles", "Complete LaySheet"], primary: "Generate Bundles", tabs: ["Active LaySheet", "Bundles", "Delivery", "Activity"],
        cards: [],
        setup: [["Production detail", "34s GL Dyed Fabric-1"], ["Item", "34s GL Dyed Fabric"], ["Maximum plys", "100"], ["Allowance", "3%"]],
        section: "Active LaySheet · YRP-LS-2026-00118", eyebrow: "Execution", count: "96 plys",
        columns: ["Layer", "Roll / Bundle", "Colour", "Dia", "Length", "Plys", "Status"],
        rows: [
          ["01", "ROLL-0926-184", "Navy", "19 Dia", "38.40 m", "32", "Laid"],
          ["02", "ROLL-0926-191", "Navy", "19 Dia", "37.85 m", "32", "Laid"],
          ["03", "ROLL-0926-204", "Navy", "19 Dia", "38.10 m", "32", "In progress"],
          ["—", "Total", "", "", "114.35 m", "96", "84.6% yield"]
        ],
        metrics: [["Planned plys", "100"], ["Actual plys", "96"], ["Bundles", "48"], ["Delivered", "0"]],
        rail: [["LaySheet workflow", [["YRP-LS-2026-00118", "Active · Cutting", ""], ["YRP-LS-2026-00119", "Ready · 84 plys", ""], ["YRP-LS-2026-00120", "Setup pending", "warn"], ["YRP-LS-2026-00121", "Queued", "warn"]]]]
      },
      "lay-sheet-planner": {
        area: "Cutting", back: "LaySheet Planner", title: "LaySheet Planner", id: "YRP-LSP-2026-00009", status: "Optimized",
        facts: [["Lot", "F0926-49"], ["Item", "34s GL Dyed Fabric"], ["Selected strategy", "Balanced Yield"]],
        actions: ["Re-optimize", "Save Inputs"], primary: "Re-optimize", tabs: ["Inputs", "Plan", "Deviation", "Activity"],
        cards: [
          ["Planning Inputs", "Constraints", [["Required quantity", "2,016 Pcs"], ["Maximum plys", "100"], ["Tolerance", "3%"], ["Fabric width", "72 inches"]]],
          ["Order Mix", "Demand", [["S", "336"], ["M", "672"], ["L", "672"], ["XL", "336"]]],
          ["Material", "Availability", [["Available rolls", "14"], ["Available weight", "1,248.6 Kg"], ["Usable length", "1,774.8 m"], ["Shade groups", "2"]]],
          ["Optimization", "Control", [["Status", "Completed"], ["Strategies", "3 evaluated"], ["Selected", "Balanced Yield"], ["Last run", "08 Oct · 11:42 AM"]]]
        ],
        strategies: [
          ["Balanced Yield", "86.8%", "Selected · 3 LaySheets", true],
          ["Minimum Waste", "88.1%", "4 LaySheets · +2.4 hrs", false],
          ["Fastest Cut", "82.7%", "2 LaySheets · -1.6 hrs", false]
        ],
        section: "Selected lay plan", eyebrow: "Plan", count: "3 LaySheets",
        columns: ["LaySheet", "Marker", "Ratio", "Plys", "Planned pcs", "Waste", "Deviation"],
        rows: [
          ["YRP-LS-2026-00118", "MKR-0031", "1:2:2:1", "96", "1,152", "13.2%", "0.8%"],
          ["YRP-LS-2026-00119", "MKR-0032", "1:2:2:1", "54", "648", "12.6%", "1.1%"],
          ["YRP-LS-2026-00120", "MKR-0034", "1:1:1:1", "54", "216", "14.3%", "0.6%"]
        ],
        metrics: [["Planned pcs", "2,016"], ["Efficiency", "86.8%"], ["Waste", "13.2%"], ["Deviation", "0.8%"]],
        rail: [["Optimization summary", [["Balanced Yield", "Selected strategy", ""], ["3 LaySheets", "204 total plys", ""], ["Within tolerance", "All sizes", ""]]], ["Warnings", [["Shade split", "2 rolls require isolation", "warn"]]]]
      }
    };

    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
    const metricHtml = (items) => `<div class="metrics">${items.map(([label,value]) => `<div class="metric"><span class="label">${esc(label)}</span><strong>${esc(value)}</strong></div>`).join("")}</div>`;
    const railHtml = (groups) => groups.map(([title,rows]) => `<section class="rail-card"><div class="rail-head"><strong>${esc(title)}</strong><span class="count">${rows.length}</span></div><div class="rail-list">${rows.map(([name,meta,tone]) => `<div class="rail-row"><div><strong>${esc(name)}</strong><small>${esc(meta)}</small></div><span class="mini-status ${tone === "warn" ? "warn" : ""}">${tone === "warn" ? "Pending" : "Open"}</span></div>`).join("")}</div></section>`).join("");
    const cuttingRailHtml = (groups) => `<div class="operations-rail">${groups.map(([title,rows], groupIndex) => `<section class="operation-section" data-operation-section="${esc(title)}"><div class="operation-head"><div class="operation-title"><strong>${esc(title)}</strong><span class="count">${rows.length}</span></div><div class="operation-actions"><button class="rail-filter-button" type="button" data-rail-filter="${esc(title)}" aria-label="Filter ${esc(title)}">▽</button><button class="rail-create-button" type="button">＋ New</button></div></div><div class="operation-list">${rows.map(([name,meta,tone], rowIndex) => { const status = meta.split(" · ")[0]; const detail = meta.split(" · ").slice(1).join(" · "); return `<article class="operation-row"><div class="operation-row-top"><strong>${groupIndex === 0 ? `Marker ${rowIndex + 1}` : `Lay ${rowIndex + 1}`}</strong><span class="mini-status ${tone === "warn" ? "warn" : ""}">${esc(status)}</span></div><span class="operation-id">${esc(name)}</span><div class="operation-row-meta"><span>${esc(detail || (groupIndex === 0 ? "Marker ready" : "LaySheet ready"))}</span><span>${groupIndex === 0 ? `${82 + rowIndex * 4}.4% yield` : `08-10-2026`}</span></div>${groupIndex === 0 ? `<div class="panel-chips"><span class="panel-chip">Front</span><span class="panel-chip">Back</span><span class="panel-chip">Sleeve</span></div>` : ""}</article>`; }).join("")}</div></section>`).join("")}</div>`;
    const cardsHtml = (cards) => cards.length ? `<div class="cards">${cards.map(([title,eyebrow,fields]) => `<section class="card"><div class="card-head"><strong>${esc(title)}</strong><small>${esc(eyebrow)}</small></div><div class="fields">${fields.map(([label,value]) => `<div class="field"><div class="label">${esc(label)}</div><div class="value" title="${esc(value)}">${esc(value)}</div></div>`).join("")}</div></section>`).join("")}</div>` : "";
    const setupHtml = (setup) => setup ? `<div class="setup-strip">${setup.map(([label,value]) => `<div class="setup-item"><div class="label">${esc(label)}</div><strong>${esc(value)}</strong></div>`).join("")}</div>` : "";
    const strategiesHtml = (strategies) => strategies ? `<section class="section"><div class="section-head"><div class="section-title"><small>Optimization</small><strong>Strategy comparison</strong></div><span class="count">3 evaluated</span></div><div class="strategy-grid">${strategies.map(([name,score,meta,selected]) => `<article class="strategy ${selected ? "selected" : ""}"><strong>${esc(name)}</strong><div class="score">${esc(score)}</div><p>${esc(meta)}</p></article>`).join("")}</div></section>` : "";
    const tableHtml = (view) => `<section class="section"><div class="section-head"><div class="section-title"><small>${esc(view.eyebrow)}</small><strong>${esc(view.section)}</strong></div><span class="count">${esc(view.count)}</span></div><div class="table-wrap"><table><thead><tr>${view.columns.map((column,index) => `<th class="${index >= Math.max(3, view.columns.length - 4) ? "num" : ""}">${esc(column)}</th>`).join("")}</tr></thead><tbody>${view.rows.map((row,rowIndex) => `<tr>${row.map((cell,index) => `<td class="${index === 0 || index === 1 ? "strong" : ""} ${index >= Math.max(3, row.length - 4) ? "num" : ""} ${view.title === "Goods Received Note" && row[3] === "Rejected" && index >= 3 ? "pending" : ""} ${rowIndex === view.rows.length - 1 && view.title === "Bulk LaySheets" ? "good" : ""}">${esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;

    function render(view, activeTab = view.tabs[0]) {
      const statusClass = view.statusTone === "attention" ? "status attention" : "status";
      const tabs = view.tabs.map((tab) => `<button class="tab ${tab === activeTab ? "active" : ""}" type="button" data-tab="${esc(tab)}">${esc(tab)}</button>`).join("");
      const commands = view.actions.map((action) => `<button class="button ${action === view.primary ? "primary" : ""}">${esc(action)}</button>`).join("");
      const overviewContent = `${setupHtml(view.setup)}${cardsHtml(view.cards)}${strategiesHtml(view.strategies)}`;
      let bodyContent = `${overviewContent}${tableHtml(view)}`;
      if (view.tableTab) {
        if (activeTab === view.tabs[0]) bodyContent = overviewContent;
        else if (activeTab === view.tableTab) bodyContent = tableHtml(view);
        else bodyContent = `<div class="note">Existing ${esc(activeTab)} content remains unchanged.</div>`;
      }
      if (view.detailsSummary) {
        bodyContent = activeTab === view.tabs[0]
          ? `${overviewContent}${tableHtml(view)}`
          : `<div class="note">Existing ${esc(activeTab)} content remains unchanged.</div>`;
      }
      return `<div>
        <header class="topbar"><div class="brand"><span class="brand-mark">EY</span><span class="brand-copy"><strong>Essdee YRP</strong><small>Operations suite</small></span></div><div class="topnav"><span class="context-pill">${esc(view.area)}</span><span class="workspace-link">▦&nbsp; Workspaces</span></div></header>
        <main class="page"><div class="back">← <span>${esc(view.back)}</span></div>
          <section class="doc">
            <header class="doc-header"><div class="identity"><div class="title"><h1>${esc(view.title)}</h1><p>${esc(view.id)}</p></div><span class="${statusClass}">${esc(view.status)}</span><div class="facts">${view.facts.map(([label,value]) => `<div class="fact"><span class="label">${esc(label)}</span><strong title="${esc(value)}">${esc(value)}</strong></div>`).join("")}</div></div><div class="header-actions"><button class="button">↻</button><button class="button">Print</button></div></header>
            <div class="commandbar"><div class="command-left">${commands}</div><div class="command-right"><button class="button">More ···</button></div></div>
            <div class="workspace"><main class="main"><div class="tabs">${tabs}</div><div style="padding-top:12px">${bodyContent}<div class="note" style="margin-top:12px">Sample layout only — existing document actions and transaction rules remain unchanged.</div></div></main><aside class="rail">${view.cuttingRail ? cuttingRailHtml(view.rail) : `${metricHtml(view.metrics)}${railHtml(view.rail)}`}</aside></div>
          </section>
        </main>
      </div>`;
    }

    const requestedView = new URLSearchParams(window.location.search).get("view") || DEFAULT_VIEW;
    const selectedView = views[requestedView] || views[DEFAULT_VIEW];
    function mount(activeTab = selectedView.tabs[0]) {
      document.getElementById("app").innerHTML = render(selectedView, activeTab);
      document.querySelectorAll("[data-tab]").forEach((button) => button.addEventListener("click", () => mount(button.dataset.tab)));
      document.querySelectorAll("[data-rail-filter]").forEach((button) => button.addEventListener("click", () => button.classList.toggle("active")));
    }
    mount();
    document.title = `${selectedView.title || "Essdee YRP"} — Form View Sample`;
  </script>
</body>
</html>
